[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "humanleg"
version = "0.1.0"
description = "Python SDK for the HumanLeg.ai public agent API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "HumanLeg.ai contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://humanleg.ai"
Repository = "https://github.com/humanleg-ai/humanleg"
Issues = "https://github.com/humanleg-ai/humanleg/issues"

[tool.hatch.build.targets.wheel]
packages = ["humanleg"]
