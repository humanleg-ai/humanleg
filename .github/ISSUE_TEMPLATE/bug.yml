name: Bug report
description: Report a reproducible problem in the public SDK, MCP server or sandbox.
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, payment details or private task evidence.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the package version and minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
