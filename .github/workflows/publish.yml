name: publish

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type publish to confirm an external release"
        required: true
        type: string
      npm:
        description: "Publish the three npm packages"
        required: true
        default: true
        type: boolean
      pypi:
        description: "Publish the Python SDK to PyPI"
        required: true
        default: true
        type: boolean
      mcp_registry:
        description: "Publish the server entry to the official MCP Registry"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    if: inputs.confirmation == 'publish' && inputs.npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish TypeScript SDK
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          if npm view "@humanleg/sdk@$version" version >/dev/null 2>&1; then
            echo "@humanleg/sdk@$version is already published"
          else
            npm publish --workspace @humanleg/sdk --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sandbox
        run: |
          version=$(node -p "require('./packages/sandbox/package.json').version")
          if npm view "@humanleg/sandbox@$version" version >/dev/null 2>&1; then
            echo "@humanleg/sandbox@$version is already published"
          else
            npm publish --workspace @humanleg/sandbox --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish MCP server
        run: |
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          if npm view "@humanleg/mcp-server@$version" version >/dev/null 2>&1; then
            echo "@humanleg/mcp-server@$version is already published"
          else
            npm publish --workspace @humanleg/mcp-server --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: inputs.confirmation == 'publish' && inputs.pypi
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m unittest discover -s python/tests -v
      - run: python -m build python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  mcp-registry:
    if: inputs.confirmation == 'publish' && inputs.mcp_registry
    runs-on: ubuntu-latest
    environment: mcp-registry
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - name: Wait for the public npm package
        run: |
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          for attempt in $(seq 1 50); do
            published=$(npm view "@humanleg/mcp-server@$version" version 2>/dev/null || true)
            if [ "$published" = "$version" ]; then
              exit 0
            fi
            echo "npm propagation pending ($attempt/50)"
            sleep 30
          done
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher validate
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
